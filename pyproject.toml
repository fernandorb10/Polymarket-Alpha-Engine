[project]
name = "polymarket-alpha-engine"
version = "1.1.0"
description = "Polymarket market scanner, AI probability engine and paper-trading platform"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "openai>=1.60,<3",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
alpha-engine = "alpha_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpha_engine"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
