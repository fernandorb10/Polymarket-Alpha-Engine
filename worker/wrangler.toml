name = "el-rojilla-bot"
main = "src/index.ts"
compatibility_date = "2026-08-01"
account_id = "fef4871d5a8663c35e84e888fa6f8e14"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "el-rojilla-bot-db"
database_id = "bd1aa4a0-0ace-4d04-a19c-3e1b046cb876"

# --- V6 conservative strategy config (mirrors alpha_engine/config.py) ---
# Secrets (set via `wrangler secret put <NAME>`, not committed here):
#   OPENAI_API_KEY, GEMINI_API_KEY, DASHBOARD_USERNAME, DASHBOARD_PASSWORD,
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
[vars]
AI_PROVIDER = "gemini"
AI_ENABLED = "true"
OPENAI_MODEL = "gpt-5-mini"
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai/"
WEB_RESEARCH_ENABLED = "true"
WEB_RESEARCH_MAX_ITEMS = "8"
WEB_RESEARCH_TIMEOUT_MS = "10000"
REQUIRE_WEB_EVIDENCE = "true"
MIN_EVIDENCE_SOURCES = "2"

GAMMA_URL = "https://gamma-api.polymarket.com"
CLOB_URL = "https://clob.polymarket.com"
HTTP_TIMEOUT_MS = "30000"
SCAN_LIMIT = "1000"
SCAN_PAGE_SIZE = "100"
ANALYSIS_TOP_N = "7"
ANALYSIS_COOLDOWN_MINUTES = "180"
DIVERSITY_COOLDOWN_MINUTES = "30"
DIVERSIFY_ANALYSIS = "true"
ANALYSIS_CATEGORIES = "sports,crypto,economy,politics,technology,entertainment,other"
MAX_ANALYSIS_PER_CATEGORY = "2"
DISCOVERY_BUDGET_FRACTION = "0.40"

MIN_LIQUIDITY = "10000"
MIN_VOLUME = "25000"
MAX_SPREAD = "0.03"
MIN_PRICE = "0.15"
MAX_PRICE = "0.85"
MIN_HOURS_TO_CLOSE = "12"
MAX_HOURS_TO_CLOSE = "336"
MIN_NET_EDGE = "0.10"
MIN_EDGE_COST_MULTIPLE = "2.5"
MIN_CONFIDENCE = "0.65"
MAX_CRITIC_RISK = "0.45"

BANKROLL_USDC = "1000"
KELLY_FRACTION = "0.10"
MAX_POSITION_PCT = "0.02"
MAX_TOTAL_EXPOSURE_PCT = "0.10"
MAX_EVENT_EXPOSURE_PCT = "0.02"
MAX_CATEGORY_EXPOSURE_PCT = "0.04"
MAX_RELATED_POSITIONS = "1"
MAX_NEW_POSITIONS_PER_DAY = "1"
DAILY_LOSS_LIMIT_PCT = "0.01"
PAUSE_DRAWDOWN_PCT = "0.05"

SLIPPAGE_BUFFER = "0.005"
PAPER_EXECUTION_SLIPPAGE_PCT = "0.0025"
PAPER_FEE_PCT = "0.001"
